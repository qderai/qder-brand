<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Qder.ai">
  <title>Qder.ai</title>
  <!-- Avatar tile for the GitHub organisation. Full bleed and no corner
       radius on purpose: GitHub rounds an org avatar itself and crops a user
       avatar to a circle, so a radius baked in here would either double up or
       leave four pale corners. The mark is sized so its bounding box corners
       stay inside a 400px radius, which is the tightest circular crop GitHub
       applies — it survives both shapes without a second file. -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g fill="#0B3FD9" transform="translate(163.6,192) scale(11.6)">
    <path fill-rule="nonzero" d="M4 25A22 22 0 1 1 48 25A22 22 0 1 1 4 25ZM13.6 25A12.4 12.4 0 1 0 38.4 25A12.4 12.4 0 1 0 13.6 25ZM23 40.5L54 40.5L54 50.1L23 50.1Z"/>
  </g>
</svg>
